# Шаблоны push-уведомлений для различных продуктов
# Правила:
# - Максимум 220 символов
# - Без CAPS LOCK
# - Максимум один восклицательный знак
# - CTA: Открыть, Настроить, Посмотреть
# - Формат валюты: "2 490 ₸"

travel_card:
  taxi_focus:
    template: "{name}, в {month} вы сделали {n_taxi} поездок на такси на {sum_taxi:.0f} ₸. С картой для путешествий вернули бы ≈{benefit:.0f} ₸. Откройте карту."
    required_fields: ["name", "month", "n_taxi", "sum_taxi", "benefit"]
  
  travel_focus:
    template: "{name}, ваши траты на путешествия за {period} составили {travel_spend:.0f} ₸. Карта для путешествий вернёт до {benefit:.0f} ₸. Оформить сейчас."
    required_fields: ["name", "period", "travel_spend", "benefit"]
  
  hotel_focus:
    template: "{name}, вы потратили {hotel_spend:.0f} ₸ на отели. С travel-картой кешбэк составил бы {benefit:.0f} ₸. Откройте карту."
    required_fields: ["name", "hotel_spend", "benefit"]

premium_card:
  high_balance:
    template: "{name}, у вас высокий остаток на счету. Премиальная карта даст до {percent}% кешбэка и бесплатные снятия. Подключите сейчас."
    required_fields: ["name", "percent"]
  
  restaurant_lover:
    template: "{name}, ваши траты в ресторанах — {restaurant_spend:,.0f} ₸. Премиум-карта вернёт до {benefit:,.0f} ₸ кешбэка. Оформить карту."
    required_fields: ["name", "restaurant_spend", "benefit"]
  
  luxury_spender:
    template: "{name}, с премиальной картой ваш кешбэк за {period} составил бы {benefit:,.0f} ₸. Откройте карту сегодня."
    required_fields: ["name", "period", "benefit"]

credit_card:
  top_categories:
    template: "{name}, ваши топ-категории — {cat1}, {cat2}, {cat3}. Кредитная карта даёт до 10% кешбэка и рассрочку. Оформить карту."
    required_fields: ["name", "cat1", "cat2", "cat3"]
  
  online_services:
    template: "{name}, вы активно пользуетесь онлайн-сервисами. Кредитная карта вернёт до {benefit:,.0f} ₸ кешбэка. Открыть карту."
    required_fields: ["name", "benefit"]
  
  installments:
    template: "{name}, оформите покупки в рассрочку с кредитной картой и получайте до 10% кешбэка. Подключить сейчас."
    required_fields: ["name"]

deposits:
  multicurrency:
    template: "{name}, защитите сбережения от курсовых колебаний. Мультивалютный вклад под {rate}% годовых. Открыть вклад."
    required_fields: ["name", "rate"]
  
  savings:
    template: "{name}, свободные средства лучше разместить на вкладе под {rate}%. Доход составит {benefit:,.0f} ₸. Открыть вклад."
    required_fields: ["name", "rate", "benefit"]
  
  accumulative:
    template: "{name}, накопительный вклад под {rate}% с возможностью пополнения. Откройте сейчас."
    required_fields: ["name", "rate"]

fx:
  active_trader:
    template: "{name}, ваш объём валютных операций — {fx_volume:,.0f} ₸. Получайте кешбэк {benefit:,.0f} ₸ с валютным счётом. Открыть счёт."
    required_fields: ["name", "fx_volume", "benefit"]
  
  currency_saver:
    template: "{name}, выгодный курс обмена валют и кешбэк до {benefit:,.0f} ₸. Откройте валютный счёт."
    required_fields: ["name", "benefit"]

cash_loan:
  urgent_needs:
    template: "{name}, нужны средства? Кредит наличными до {amount:,.0f} ₸ под выгодный процент. Оформить онлайн."
    required_fields: ["name", "amount"]
  
  quick_approval:
    template: "{name}, кредит наличными с решением за 5 минут. Сумма до {amount:,.0f} ₸. Подать заявку."
    required_fields: ["name", "amount"]

investments:
  start_investing:
    template: "{name}, начните инвестировать с суммы от {min_amount:,.0f} ₸. Потенциальный доход — {benefit:,.0f} ₸. Открыть счёт."
    required_fields: ["name", "min_amount", "benefit"]
  
  diversify:
    template: "{name}, диверсифицируйте портфель. Инвестиционные продукты с доходностью до {rate}%. Начать инвестировать."
    required_fields: ["name", "rate"]

gold:
  stability:
    template: "{name}, золото — надёжная защита капитала. Инвестируйте от {min_amount:,.0f} ₸. Открыть металлический счёт."
    required_fields: ["name", "min_amount"]
  
  luxury_protection:
    template: "{name}, защитите сбережения с помощью золота. Потенциальный доход — {benefit:,.0f} ₸. Открыть счёт."
    required_fields: ["name", "benefit"]

# Месяцы для локализации
months:
  1: "январе"
  2: "феврале"
  3: "марте"
  4: "апреле"
  5: "мае"
  6: "июне"
  7: "июле"
  8: "августе"
  9: "сентябре"
  10: "октябре"
  11: "ноябре"
  12: "декабре"

# Периоды
periods:
  3: "3 месяца"
  6: "полгода"
  12: "год"

# Шаблоны push-уведомлений (версия 3.0)
# Исправлены форматирование, консистентность названий и соответствие продуктам

# Карта для путешествий
travel_card:
  template: "{name}, в {month} у вас {taxi_count} поездок на такси на {taxi_amount}. С картой для путешествий вернули бы {cashback_amount} кешбэком. Оформить карту."
  required_fields: ["name", "month", "taxi_count", "taxi_amount", "cashback_amount"]
  validation:
    min_spend: 1000  # Минимум 1000 тенге трат
    max_cashback_rate: 0.04  # Максимум 4% от трат

# Премиальная карта
premium_card:
  high_balance:
    template: "{name}, у вас высокий остаток на счету. Премиальная карта даст до 4% кешбэка на все покупки и бесплатные снятия. Подключить карту."
    required_fields: ["name"]
  restaurant_lover:
    template: "{name}, вы часто в ресторанах ({restaurant_amount}/мес). Премиальная карта вернёт 4% с этих трат. Подключить карту."
    required_fields: ["name", "restaurant_amount"]

# Кредитная карта
credit_card:
  template: "{name}, ваши топ-категории — {top_category_1}, {top_category_2}, {top_category_3}. Кредитная карта даёт до 10% кешбэка в любимых категориях. Оформить карту."
  required_fields: ["name", "top_category_1", "top_category_2", "top_category_3"]

# Обмен валют
fx:
  template: "{name}, вы часто меняете валюту ({fx_volume}). В приложении выгодный курс 24/7 без комиссии. Настроить обмен."
  required_fields: ["name", "fx_volume"]
  validation:
    min_volume: 50000  # Минимум 50k объема

# Депозит Сберегательный
deposit_savings:
  template: "{name}, у вас остаются свободные средства. Сберегательный вклад под 16,5% годовых без возможности снятия. Открыть вклад."
  required_fields: ["name"]

# Депозит Накопительный
deposit_accumulative:
  template: "{name}, у вас остаются свободные средства. Накопительный вклад под 15,5% годовых с возможностью пополнения. Открыть вклад."
  required_fields: ["name"]

# Депозит Мультивалютный
deposit_multicurrency:
  template: "{name}, вы работаете с валютой. Мультивалютный депозит под 14,5% с доступом к средствам. Открыть депозит."
  required_fields: ["name"]

# Инвестиции
investments:
  template: "{name}, попробуйте инвестиции с низким порогом входа и без комиссий на старт. Открыть счёт."
  required_fields: ["name"]

# Золотые слитки
gold:
  template: "{name}, диверсифицируйте портфель золотыми слитками 999,9 пробы. Предзаказ в приложении. Узнать подробнее."
  required_fields: ["name"]

# Кредит наличными
cash_loan:
  template: "{name}, если нужны средства — кредит наличными до {loan_limit} от 12% годовых без залога. Узнать лимит."
  required_fields: ["name", "loan_limit"]

# Периоды для подстановки в шаблоны
periods:
  1: "январе"
  2: "феврале"
  3: "марте"
  4: "апреле"
  5: "мае"
  6: "июне"
  7: "июле"
  8: "августе"
  9: "сентябре"
  10: "октябре"
  11: "ноябре"
  12: "декабре"

# Правила форматирования
formatting:
  decimal_separator: ","
  thousands_separator: " "
  currency_format: "{amount} ₸"
  percentage_format: "{value}%"

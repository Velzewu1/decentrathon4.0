# Конфигурация весов и параметров для расчета benefit score (версия 2.0)
# Согласно заданию хакатона

# Курсы валют для конвертации
currency_rates:
  USD: 480
  EUR: 520
  RUB: 5.5
  KZT: 1

# ПРОДУКТ 1: Карта для путешествий
travel_card:
  cashback_rate: 0.04  # 4% кешбэк
  categories:
    - "Путешествия"
    - "Такси"
    - "Отели"
    - "Авиабилеты"
    - "Поезда"
    - "Самолеты"
  # Для выгоды считаем кешбэк от трат за 3 месяца

# ПРОДУКТ 2: Премиальная карта
premium_card:
  # Уровни кешбэка в зависимости от депозита
  tier_thresholds:
    base: 0
    tier2: 1000000    # 1 млн ₸
    tier3: 6000000    # 6 млн ₸
  tier_cashback_rates:
    base: 0.02   # 2% базовый
    tier2: 0.03  # 3% при депозите 1-6 млн
    tier3: 0.04  # 4% при депозите от 6 млн
  special_cashback_rate: 0.04  # 4% на специальные категории
  special_categories:
    - "Ювелирные украшения"
    - "Косметика и парфюмерия"
    - "Кафе и рестораны"
  cashback_cap: 100000  # Лимит кешбэка 100k ₸/мес
  free_atm_limit: 3000000  # Бесплатное снятие до 3 млн ₸/мес
  # Экономия на комиссиях за снятие/переводы

# ПРОДУКТ 3: Кредитная карта
credit_card:
  credit_limit: 2000000  # До 2 млн ₸
  grace_period: 2  # 2 месяца без процентов
  top_categories_cashback: 0.10  # 10% на топ-3 категории
  online_cashback: 0.10  # 10% на онлайн-сервисы
  online_categories:
    - "Играем дома"
    - "Едим дома"
    - "Смотрим дома"
    - "Онлайн-сервисы"
  # Активируется для тех, у кого есть кредитные платежи

# ПРОДУКТ 4: Обмен валют (FX)
fx:
  benefit_rate: 0.005  # Экономия на курсе примерно 0.5%
  # Для тех, кто активно меняет валюту

# ПРОДУКТ 5: Кредит наличными
cash_loan:
  rate_1year: 0.12  # 12% на 1 год
  rate_over_1year: 0.21  # 21% свыше года
  # Предлагаем если расходы превышают доходы

# ПРОДУКТ 6: Депозит Мультивалютный
deposit_multicurrency:
  rate: 0.145  # 14.5% годовых
  # Пополнение и снятие без ограничений
  # Для тех, кто работает с валютой

# ПРОДУКТ 7: Депозит Сберегательный
deposit_savings:
  rate: 0.165  # 16.5% годовых
  # Без пополнения и снятия
  # Максимальный доход для тех, кто может заморозить

# ПРОДУКТ 8: Депозит Накопительный
deposit_accumulative:
  rate: 0.155  # 15.5% годовых
  # С пополнением, без снятия
  # Для регулярных накоплений

# ПРОДУКТ 9: Инвестиции
investments:
  expected_return: 0.20  # Ожидаемая доходность 20% годовых
  min_amount: 6  # От 6 тенге
  # Для тех, у кого есть свободные средства

# ПРОДУКТ 10: Золотые слитки
gold:
  expected_return: 0.10  # Ожидаемая доходность 10% годовых
  # Для диверсификации и долгосрочного сохранения

# Приоритеты продуктов при равном benefit
product_priority:
  1: "Карта для путешествий"
  2: "Премиальная карта"
  3: "Кредитная карта"
  4: "Депозит Сберегательный"
  5: "Депозит Накопительный"
  6: "Депозит Мультивалютный"
  7: "Обмен валют"
  8: "Инвестиции"
  9: "Золотые слитки"
  10: "Кредит наличными"

# Общие параметры
general:
  aggregation_months: 3  # Анализируем данные за 3 месяца
  push_max_length: 220  # Максимальная длина push-уведомления
  top_products_count: 4  # Выбираем топ-4 продукта для оценки

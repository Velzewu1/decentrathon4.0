# Шаблоны push-уведомлений версия 2.0
# Согласно TOV из задания хакатона

# Правила TOV:
# - Обращение на "вы" с маленькой буквы
# - Без CAPS, максимум один "!"
# - Длина 180-220 символов
# - Формат валюты: "2 490 ₸"
# - Просто, по-человечески, доброжелательно
# - CTA: глагол действия

# КАРТА ДЛЯ ПУТЕШЕСТВИЙ
travel_card:
  taxi_lover:
    template: "{name}, в {month} у вас {n_taxi} поездок на такси на {taxi_amount:.0f} ₸. С тревел-картой вернулось бы {benefit:.0f} ₸ кешбэком. Оформить карту."
    required_fields: ["name", "month", "n_taxi", "taxi_amount", "benefit"]
  
  frequent_traveler:
    template: "{name}, ваши траты на путешествия за 3 месяца — {travel_amount:.0f} ₸. Карта вернёт 4% кешбэком. Открыть в приложении."
    required_fields: ["name", "travel_amount"]
  
  hotel_user:
    template: "{name}, вы часто бронируете отели. Тревел-карта даст 4% кешбэк и привилегии Visa Signature. Подключить сейчас."
    required_fields: ["name"]

# ПРЕМИАЛЬНАЯ КАРТА  
premium_card:
  high_balance:
    template: "{name}, у вас стабильно высокий остаток. Премиальная карта даст до {percent}% кешбэка и бесплатные снятия. Оформить сейчас."
    required_fields: ["name", "percent"]
  
  restaurant_spender:
    template: "{name}, вы часто в ресторанах ({restaurant_amount:.0f} ₸/мес). Премиум-карта вернёт 4% с этих трат. Подключить карту."
    required_fields: ["name", "restaurant_amount"]
  
  luxury_buyer:
    template: "{name}, на ювелирные изделия и парфюмерию премиальная карта даёт повышенный кешбэк 4%. Открыть карту."
    required_fields: ["name"]

# КРЕДИТНАЯ КАРТА
credit_card:
  top_categories:
    template: "{name}, ваши топ-категории — {cat1}, {cat2}, {cat3}. Кредитная карта даёт до 10% кешбэка. Оформить карту."
    required_fields: ["name", "cat1", "cat2", "cat3"]
  
  online_active:
    template: "{name}, вы активно пользуетесь онлайн-сервисами. Кредитка вернёт 10% с доставки, игр и кино. Открыть карту."
    required_fields: ["name"]
  
  needs_credit:
    template: "{name}, кредитная карта до 2 млн ₸ с беспроцентным периодом 2 месяца. Узнать лимит."
    required_fields: ["name"]

# ОБМЕН ВАЛЮТ
fx:
  active_trader:
    template: "{name}, вы часто меняете валюту ({fx_volume:.0f} ₸). В приложении выгодный курс 24/7. Настроить обмен."
    required_fields: ["name", "fx_volume"]
  
  currency_user:
    template: "{name}, вы платите в {currency}. Выгодный обмен в приложении без комиссии. Открыть валютный счёт."
    required_fields: ["name", "currency"]

# КРЕДИТ НАЛИЧНЫМИ
cash_loan:
  needs_funds:
    template: "{name}, если нужны средства — кредит наличными до {amount:.0f} ₸ от 12% годовых. Узнать доступный лимит."
    required_fields: ["name", "amount"]
  
  quick_loan:
    template: "{name}, кредит наличными с гибкими выплатами и без залога. Оформить онлайн за 5 минут."
    required_fields: ["name"]

# ДЕПОЗИТЫ
deposits:
  multicurrency:
    template: "{name}, мультивалютный вклад под 14.5% с доступом к деньгам. Защитите от курсовых колебаний. Открыть вклад."
    required_fields: ["name"]
  
  savings:
    template: "{name}, у вас остаются свободные средства. Сберегательный вклад под 16.5% годовых. Открыть вклад."
    required_fields: ["name"]
  
  accumulative:
    template: "{name}, накопительный вклад под 15.5% с возможностью пополнения. Удобно откладывать. Открыть вклад."
    required_fields: ["name"]

# ИНВЕСТИЦИИ
investments:
  start_investing:
    template: "{name}, попробуйте инвестиции с порога входа от 6 ₸. Без комиссий в первый год. Открыть счёт."
    required_fields: ["name"]
  
  has_free_funds:
    template: "{name}, у вас есть свободные {amount:.0f} ₸. Инвестиции могут принести больше дохода. Начать инвестировать."
    required_fields: ["name", "amount"]

# ЗОЛОТЫЕ СЛИТКИ
gold:
  diversification:
    template: "{name}, золото — надёжная защита капитала. Слитки 999 пробы в отделениях банка. Узнать подробнее."
    required_fields: ["name"]
  
  long_term:
    template: "{name}, диверсифицируйте сбережения золотом. Долгосрочное сохранение стоимости. Посмотреть условия."
    required_fields: ["name"]

# Месяцы для форматирования
months:
  1: "январе"
  2: "феврале"
  3: "марте"
  4: "апреле"
  5: "мае"
  6: "июне"
  7: "июле"
  8: "августе"
  9: "сентябре"
  10: "октябре"
  11: "ноябре"
  12: "декабре"

# Валюты для отображения
currencies:
  USD: "долларах"
  EUR: "евро"
  RUB: "рублях"

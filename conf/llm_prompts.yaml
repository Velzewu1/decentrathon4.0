# Промпты для генерации персонализированных push-уведомлений через LLM
# Согласно строгим требованиям TOV из ТЗ хакатона

system_prompt: |
  Ты - эксперт по написанию персонализированных банковских push-уведомлений.

  СТРОГИЕ ПРАВИЛА TOV (Tone of Voice):
  • Обращение на "вы" с маленькой буквы, просто и по-человечески
  • БЕЗ КАПС, максимум один восклицательный знак (только по делу)  
  • Длина строго 180-220 символов для push-уведомлений
  • Важное - в начало, без воды и канцеляризмов
  • Доброжелательный тон, допустим легкий ненавязчивый юмор
  • Для молодежи (до 30 лет) - меньше официоза, живее (но без жаргона)

  ФОРМАТ:
  • Валюта: "2 490 ₸" (пробел между разрядами и перед символом)
  • Числа: дробная часть через запятую, разряды через пробелы
  • CTA: глаголы действия ("Оформить", "Открыть", "Настроить")
  • БЕЗ крикливых обещаний и давления

  СТРУКТУРА СООБЩЕНИЯ:
  1. Персональное наблюдение (по тратам/поведению)
  2. Конкретная польза продукта
  3. Призыв к действию

  Отвечай ТОЛЬКО текстом push-уведомления, без пояснений.

# Специализированные промпты для каждого продукта
product_prompts:
  
  "Карта для путешествий":
    context: |
      Карта дает 4% кешбэк на путешествия, такси, отели, авиабилеты, поезда.
      Есть привилегии Visa Signature.
      Подходит активным путешественникам и тем, кто часто ездит на такси.
    
    persona_young: |
      Стиль: живой, дружелюбный, можно с легким юмором
      Примеры фраз: "постоянно в пути", "куда только не ездите", "верните часть потраченного"
    
    persona_adult: |
      Стиль: вежливый, деловой, конкретный
      Примеры фраз: "активные поездки", "возврат средств", "оптимизировать расходы"

  "Премиальная карта":
    context: |
      Кешбэк 2-4% в зависимости от депозита (базовый 2%, при 1-6 млн - 3%, от 6 млн - 4%).
      Повышенный 4% кешбэк на ювелирку, парфюмерию, рестораны.
      Бесплатное снятие наличных до 3 млн ₸/мес, бесплатные переводы.
      Подходит клиентам с высокими балансами и премиальными тратами.
    
    persona_young: |
      Стиль: стремление к статусу, современность
      Примеры фраз: "премиальный уровень", "больше возможностей", "статусные привилегии"
    
    persona_adult: |
      Стиль: подчеркивание выгоды и статуса
      Примеры фраз: "максимальный кешбэк", "VIP-условия", "оптимальные условия"

  "Кредитная карта":
    context: |
      До 2 млн ₸ лимит, 2 месяца без процентов.
      10% кешбэк на топ-3 категории (выбираются ежемесячно).
      10% на онлайн-сервисы: игры, доставка, кино.
      Рассрочка 3-24 месяца без переплат.
      Подходит тем, кто оптимизирует траты и пользуется кредитными средствами.
    
    persona_young: |
      Стиль: акцент на онлайн и удобство
      Примеры фраз: "ваши любимые категории", "кешбэк с покупок", "удобная рассрочка"
    
    persona_adult: |
      Стиль: финансовые выгоды и планирование  
      Примеры фраз: "оптимизация расходов", "максимальная выгода", "финансовые возможности"

  "Обмен валют":
    context: |
      Выгодный курс в приложении, без комиссии, 24/7.
      Автопокупка по целевому курсу.
      Подходит тем, кто часто меняет валюту.
    
    persona_young: |
      Стиль: удобство и технологичность
      Примеры фраз: "в приложении за секунды", "ловите курс", "всегда под рукой"
    
    persona_adult: |
      Стиль: выгода и надежность
      Примеры фраз: "выгодный курс", "экономия на обмене", "безопасные операции"

  "Кредит наличными":
    context: |
      Без залога, справок, цели. Онлайн оформление.
      12% на 1 год, 21% свыше года.
      Досрочное погашение без штрафов.
      Предлагать только при явной финансовой потребности.
    
    persona_young: |
      Стиль: быстрота и простота
      Примеры фраз: "быстро и просто", "без лишней бумажной волокиты", "деньги сегодня"
    
    persona_adult: |
      Стиль: надежность и условия
      Примеры фраз: "выгодные условия", "гибкие выплаты", "финансовая поддержка"

  "Депозит Сберегательный":
    context: |
      16,5% годовых, максимальная ставка.
      Без пополнения и снятия до окончания срока.
      Подходит для "заморозки" средств ради максимального дохода.
    
    persona_young: |
      Стиль: накопления и цели
      Примеры фраз: "копите на цель", "максимальный доход", "деньги работают"
    
    persona_adult: |
      Стиль: стабильность и доходность
      Примеры фраз: "надежные накопления", "стабильный доход", "выгодное размещение"

  "Депозит Накопительный":
    context: |
      15,5% годовых с возможностью пополнения.
      Без снятия, но можно доложить.
      Подходит для планомерных накоплений.
    
    persona_young: |
      Стиль: накопительная привычка
      Примеры фраз: "откладывайте регулярно", "копите с выгодой", "финансовая дисциплина"
    
    persona_adult: |
      Стиль: планирование и рост капитала
      Примеры фраз: "планомерные накопления", "рост сбережений", "финансовое планирование"

  "Депозит Мультивалютный":
    context: |
      14,5% годовых, работа с разными валютами.
      Пополнение и снятие без ограничений.
      Подходит тем, кто работает с валютой и хочет защититься от курсовых колебаний.
    
    persona_young: |
      Стиль: диверсификация и гибкость
      Примеры фраз: "защита от курсовых скачков", "гибкое управление", "валютная корзина"
    
    persona_adult: |
      Стиль: защита капитала
      Примеры фраз: "валютная диверсификация", "защита от рисков", "стабильность капитала"

  "Инвестиции":
    context: |
      От 6 тенге, без комиссий в первый год.
      Ожидаемая доходность 20% годовых.
      Подходит для старта инвестиций с малых сумм.
    
    persona_young: |
      Стиль: возможности и рост
      Примеры фраз: "начните с малого", "растите капитал", "инвестиционные возможности"
    
    persona_adult: |
      Стиль: доходность и перспективы
      Примеры фраз: "приумножение капитала", "инвестиционная доходность", "финансовый рост"

  "Золотые слитки":
    context: |
      999 пробы, разные веса, хранение в банке.
      Защита от инфляции и диверсификация портфеля.
      Подходит для долгосрочного сохранения капитала.
    
    persona_young: |
      Стиль: диверсификация и статус
      Примеры фраз: "защита капитала", "инвестиции в будущее", "надежное вложение"
    
    persona_adult: |
      Стиль: стабильность и защита
      Примеры фраз: "сохранение капитала", "защита от инфляции", "долгосрочные вложения"

# Примеры хороших push-уведомлений для каждого продукта
examples:
  "Карта для путешествий":
    - "Айгерим, в августе 12 поездок на такси — 27 400 ₸. С тревел-картой вернули бы 1 100 ₸ кешбэком. Оформить карту."
    - "Данияр, ваши траты на путешествия 45 000 ₸ за квартал. 4% кешбэк = 1 800 ₸ возврат. Открыть карту."
    
  "Премиальная карта":
    - "Алия, высокий остаток дает возможности. Премиум-карта до 4% кешбэка + бесплатные снятия. Оформить сейчас."
    - "Серик, в ресторанах 150 000 ₸/мес. Премиальная карта вернет 4% с этих трат = 6 000 ₸. Подключить."
    
  "Кредитная карта":
    - "Тимур, топ-категории: продукты, рестораны, такси. Кредитка даст 10% кешбэка. Оформить карту."
    - "Мадина, активно пользуетесь доставкой и онлайн-сервисами. 10% кешбэк с кредитной карты. Открыть."

# Слова и фразы, которых нужно избегать
avoid_phrases:
  - "СУПЕР предложение"
  - "СРОЧНО" 
  - "ТОЛЬКО СЕГОДНЯ"
  - "ПОСЛЕДНИЙ ШАНС"
  - "ЭКСКЛЮЗИВ"
  - "НЕ УПУСТИТЕ"
  - "СПЕЦИАЛЬНО ДЛЯ ВАС!!!"
  - банковские канцеляризмы
  - пассивный залог
  - сложные финансовые термины без объяснения

# Хорошие CTA (призывы к действию)
good_cta:
  - "Оформить карту"
  - "Открыть счет"
  - "Настроить обмен"
  - "Подключить сейчас"
  - "Узнать лимит"
  - "Посмотреть условия"
  - "Начать инвестировать"

# Конфигурация весов и параметров для расчета benefit score (версия 3.0)
# Исправлены баги с форматированием и расчетами

# Курсы валют для конвертации
currency_rates:
  USD: 480
  EUR: 520
  RUB: 5.5
  KZT: 1

# Форматирование чисел и валют
format:
  decimal_comma: true
  thousands_sep: " "   # неразрывный пробел
  currency_suffix: " ₸"

# Лимиты benefit для предотвращения нереальных значений
caps:
  cashback_monthly: 100000  # Максимум 100k кешбэка в месяц
  fx_benefit: 30000        # Максимум 30k benefit от FX
  cash_loan_benefit: 50000 # Максимум 50k benefit от кредита наличными

# ПРОДУКТ 1: Карта для путешествий
travel_card:
  cashback_rate: 0.04  # 4% кешбэк
  categories: ["Такси","Путешествия","Отели","Билеты","Поезда","Самолёты"]
  min_spend_threshold: 1000  # Минимум 1000 тенге трат для активации

# ПРОДУКТ 2: Премиальная карта
premium_card:
  base_rate_by_deposit:
    lt_1m: 0.02    # < 1 млн
    1m_6m: 0.03    # 1-6 млн
    gte_6m: 0.04   # >= 6 млн
  boosted_4pc_cats: ["Кафе и рестораны","Ювелирные украшения","Косметика и парфюмерия"]
  saved_fees_rate: 0.01     # 1% экономии на комиссиях
  saved_fees_cap: 30000     # Максимум 30k экономии
  cashback_cap: 100000      # Лимит кешбэка 100k ₸/мес

# ПРОДУКТ 3: Кредитная карта
credit_card:
  top3_rate: 0.10           # 10% на топ-3 категории
  online_rate: 0.10         # 10% на онлайн-сервисы
  require_signals: ["cc_repayment_out","installment_payment_out"]
  credit_limit: 2000000
  grace_period: 2
  cashback_cap: 50000       # Лимит кешбэка 50k ₸/мес
  online_categories:
    - "Играем дома"
    - "Смотрим дома"
    - "Доставка еды"

# ПРОДУКТ 4: Обмен валют
fx:
  k_fx: 0.002               # Снижен коэффициент
  count_types: ["fx_buy","fx_sell"]
  count_tx_currencies: ["USD","EUR"]
  benefit_rate: 0.02
  min_volume_threshold: 50000  # Минимум 50k объема для активации

# ПРОДУКТ 5: Кредит наличными
cash_loan:
  trigger:
    min_out_in_ratio: 2.0   # Расходы должны превышать доходы в 2 раза
    max_avg_balance: 20000  # Максимальный баланс 20k
    require_any: ["loan_payment_out"]  # Должны быть кредитные платежи
  rate_1year: 0.12
  rate_over1year: 0.21
  benefit_multiplier: 0.02  # Снижен множитель

# ПРОДУКТЫ: Депозиты
deposit_multicurrency:
  rate: 0.145   # 14,5%
  min_balance: 50000

deposit_savings:
  rate: 0.165   # 16,5%
  min_balance: 100000

deposit_accumulative:
  rate: 0.155   # 15,5%
  min_balance: 50000

# ПРОДУКТ: Инвестиции
investments:
  expected_return: 0.20
  min_amount: 30000
  risk_adjustment: 1.0

# ПРОДУКТ: Золотые слитки
gold:
  expected_return: 0.10
  min_balance: 300000

# Общие параметры
general:
  aggregation_months: 3
  push_max_length: 220
  top_products_count: 4

# Приоритеты продуктов для tie-breaking
product_priorities:
  - "Премиальная карта"
  - "Карта для путешествий"
  - "Кредитная карта"
  - "Депозит Сберегательный"
  - "Депозит Накопительный"
  - "Депозит Мультивалютный"
  - "Обмен валют"
  - "Инвестиции"
  - "Золотые слитки"
  - "Кредит наличными"
